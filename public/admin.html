<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Panel Kasir — ONI GAMING ZONE</title>
  
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-main: #090a0f;
      --card-bg: #12141d;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-green: #00ff66;
      --accent-red: #ff2a5f;
      --accent-yellow: #ffb703;
      --accent-blue: #3b82f6;
      --text-muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-main); color: #f8fafc; padding: 25px 20px; }

    /* Top Bar Header */
    .header-bar {
      max-width: 1200px;
      margin: 0 auto 25px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 18px 25px;
      border-radius: 14px;
    }

    .brand-info h1 { font-size: 1.4rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
    .brand-info h1 i { color: var(--accent-green); }
    .brand-info p { font-size: 0.85rem; color: var(--text-muted); }

    .pass-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .pass-box label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .pass-box input {
      background: #1a1d29;
      border: 1px solid var(--border-color);
      color: var(--accent-green);
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      outline: none;
      text-align: center;
      width: 110px;
    }

    /* Grid Layout */
    .pc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .pc-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      transition: border-color 0.2s;
    }

    .pc-card:hover { border-color: rgba(255, 255, 255, 0.2); }
    .pc-header { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    
    .status-badge {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: inline-block;
    }

    /* Control Button Groups */
    .btn-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-align: left;
    }

    .btn-group { display: flex; gap: 5px; margin-bottom: 12px; justify-content: center; }

    .btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn:active { transform: scale(0.96); }

    /* Button Variants */
    .btn-time {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      border: 1px solid var(--border-color);
    }
    .btn-time:hover { background: rgba(0, 255, 102, 0.15); color: var(--accent-green); border-color: var(--accent-green); }

    .btn-pkg {
      background: rgba(255, 183, 3, 0.08);
      color: var(--accent-yellow);
      border: 1px solid rgba(255, 183, 3, 0.25);
    }
    .btn-pkg:hover { background: var(--accent-yellow); color: #000; }

    .btn-avail {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .btn-avail:hover { background: var(--accent-blue); color: #fff; }

    .btn-off {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }
    .btn-off:hover { background: #334155; color: #fff; }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="header-bar">
    <div class="brand-info">
      <h1><i class="fas fa-sliders"></i> PANEL KASIR WARNET</h1>
      <p>ONI GAMING ZONE — Management Control System</p>
    </div>
    <div class="pass-box">
      <label><i class="fas fa-key"></i> Key Pass:</label>
      <input type="password" id="adminPass" value="oni123">
    </div>
  </div>

  <!-- Grid PC Monitoring -->
  <div class="pc-grid" id="adminGrid"></div>

  <!-- Socket.IO Engine & Local Storage Persistence -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io('https://oni-gaming-zone.up.railway.app');

    // Default ONI-01 s/d ONI-09
    const defaultPCState = {};
    for (let i = 1; i <= 9; i++) {
      const pcId = `ONI-${i < 10 ? '0' + i : i}`;
      defaultPCState[pcId] = { id: pcId, status: 'available', endTime: 0 };
    }

    function formatCountdown(endTime) {
      if (!endTime) return '';
      const now = Math.floor(Date.now() / 1000);
      const sisaDetik = endTime - now;
      if (sisaDetik <= 0) return '';

      const jam = Math.floor(sisaDetik / 3600);
      const menit = Math.floor((sisaDetik % 3600) / 60);
      const detik = sisaDetik % 60;

      const jStr = jam < 10 ? '0' + jam : jam;
      const mStr = menit < 10 ? '0' + menit : menit;
      const dStr = detik < 10 ? '0' + detik : detik;

      return `(${jStr}:${mStr}:${dStr})`;
    }

    // Fungsi Pengirim Data Update Manual
    function setStatus(pcKey, status, hours = 0, packageType = '') {
      const pass = document.getElementById('adminPass').value;
      
      const now = Math.floor(Date.now() / 1000);
      let targetEndTime = 0;

      if (status === 'used') {
        if (hours > 0) {
          targetEndTime = now + (hours * 3600);
        } else if (packageType === 'pagi') {
          const t = new Date(); t.setHours(12, 0, 0, 0);
          if (t.getTime() / 1000 <= now) t.setDate(t.getDate() + 1);
          targetEndTime = Math.floor(t.getTime() / 1000);
        } else if (packageType === 'malam') {
          const t = new Date(); t.setHours(6, 0, 0, 0);
          if (t.getTime() / 1000 <= now) t.setDate(t.getDate() + 1);
          targetEndTime = Math.floor(t.getTime() / 1000);
        }
      }

      const localCache = JSON.parse(localStorage.getItem('oni_pc_status') || '{}');
      localCache[pcKey] = { id: pcKey, status: status, endTime: targetEndTime };
      localStorage.setItem('oni_pc_status', JSON.stringify(localCache));
      
      const merged = { ...defaultPCState, ...localCache };
      renderAdminGrid(Object.values(merged));

      fetch('/api/update-manual', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          pcName: pcKey, 
          status: status, 
          hours: hours, 
          packageType: packageType, 
          password: pass 
        })
      }).then(res => {
        if (!res.ok) alert('Password Kasir Salah atau Akses Ditolak!');
      });
    }

    function renderAdminGrid(pcList) {
      const grid = document.getElementById('adminGrid');
      grid.innerHTML = '';
      const now = Math.floor(Date.now() / 1000);
      
      pcList.forEach(pc => {
        let currentStatus = pc.status;
        let endTime = pc.endTime;

        if (endTime && endTime <= now) {
          currentStatus = 'available';
          endTime = 0;
        }

        const countdownText = formatCountdown(endTime);
        
        let statusStyle = 'background: rgba(0, 255, 102, 0.1); color: #00ff66; border: 1px solid rgba(0, 255, 102, 0.2);';
        let statusLabel = 'TERSEDIA';

        if (currentStatus === 'used') {
          statusStyle = 'background: rgba(255, 42, 95, 0.1); color: #ff2a5f; border: 1px solid rgba(255, 42, 95, 0.2);';
          statusLabel = countdownText ? `TERPAKAI ${countdownText}` : 'TERPAKAI';
        } else if (currentStatus === 'off') {
          statusStyle = 'background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2);';
          statusLabel = 'OFF / MATI';
        }

        grid.innerHTML += `
          <div class="pc-card">
            <div class="pc-header">${pc.id}</div>
            <div class="status-badge" style="${statusStyle}">${statusLabel}</div>
            
            <div class="btn-section-title">Billing Reguler</div>
            <div class="btn-group">
              <button class="btn btn-time" onclick="setStatus('${pc.id}', 'used', 1)">+1j</button>
              <button class="btn btn-time" onclick="setStatus('${pc.id}', 'used', 2)">+2j</button>
              <button class="btn btn-time" onclick="setStatus('${pc.id}', 'used', 3)">+3j</button>
              <button class="btn btn-time" onclick="setStatus('${pc.id}', 'used', 5)">+5j</button>
            </div>

            <div class="btn-section-title">Paket Khusus</div>
            <div class="btn-group">
              <button class="btn btn-pkg" onclick="setStatus('${pc.id}', 'used', 0, 'pagi')" title="Otomatis selesai jam 12.00 WIB"><i class="fas fa-sun"></i> P. Pagi</button>
              <button class="btn btn-pkg" onclick="setStatus('${pc.id}', 'used', 0, 'malam')" title="Otomatis selesai jam 06.00 WIB"><i class="fas fa-moon"></i> P. Malam</button>
            </div>

            <div class="btn-section-title">Kontrol Status</div>
            <div class="btn-group">
              <button class="btn btn-avail" onclick="setStatus('${pc.id}', 'available')"><i class="fas fa-check"></i> Reset</button>
              <button class="btn btn-off" onclick="setStatus('${pc.id}', 'off')"><i class="fas fa-power-off"></i> OFF</button>
            </div>
          </div>
        `;
      });
    }

    // Load data awal langsung dari gabungan default + cache lokal
    const cachedAdminData = JSON.parse(localStorage.getItem('oni_pc_status') || '{}');
    const initialMerged = { ...defaultPCState, ...cachedAdminData };
    renderAdminGrid(Object.values(initialMerged));

    // Listener sync Socket.IO
    socket.on('pcStatusUpdate', (payload) => {
      const pcData = payload.pcData || payload;
      const list = Array.isArray(pcData) ? pcData : Object.values(pcData);
      
      const storageObj = {};
      list.forEach(pc => storageObj[pc.id] = pc);
      localStorage.setItem('oni_pc_status', JSON.stringify(storageObj));

      const merged = { ...defaultPCState, ...storageObj };
      renderAdminGrid(Object.values(merged));
    });

    // Auto-refresh countdown setiap 1 detik
    setInterval(() => {
      const localData = JSON.parse(localStorage.getItem('oni_pc_status') || '{}');
      const merged = { ...defaultPCState, ...localData };
      renderAdminGrid(Object.values(merged));
    }, 1000);

    // Kirim sinyal heartbeat ke server
    setInterval(() => {
      fetch('/api/admin-heartbeat', { method: 'POST' });
    }, 3000);
    fetch('/api/admin-heartbeat', { method: 'POST' });
  </script>
</body>
</html>
